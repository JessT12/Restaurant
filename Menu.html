<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medi</title>

<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fascinate+Inline&family=Limelight&display=swap" rel="stylesheet">
  
<style>
body {
  margin: 0;
  padding: 0;
  background-color: #eeecd2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

main{
  flex: 1;
}

ul.topnav {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  list-style-type: none;
  margin: 0;
  padding: 0;
  background-color: #0b0929;
  align-items: center;
}

ul.topnav li:first-child {
  flex: 1;
}

ul.topnav li a {
  display: block;
  color: #c5c3a8;
  padding: 10px 20px;
  text-decoration: none;
  font-size: 20px;
  font-family: "Limelight", cursive;
}

ul.topnav li a:hover {
  background-color: #6e7597;
  padding: 10px 20px;
  border-radius: 5px;
}

ul.topnav li a.logo {
  font-family: "Fascinate Inline", cursive;
  font-size: 25px;
  color: #c5c3a8;
  
}

ul.topnav li a.logo:hover {
  background-color: transparent;
  padding: 10px 20px;
}






/*Shopping cart*/
.add-cart {
  background-color: #0b0929;
  color: #c5c3a8;
  font-size: 30px;
  font-family: "Limelight", cursive;
  padding: 1px 11px;
  border: none;
  border-radius: 50%;
  position: absolute;
  right: 1.5vw;
  top: 1.5vh;
  cursor: pointer;
}

.add-cart:hover {
  background-color: #6e7597;
  color: #c5c3a8;
}

.cart-icon i {
  font-size: 22px;
}

.cart-icon:hover {
  background-color: #6e7597;
  border-radius: 5px;
}

.cart-count {
  display: flex;
  width: 20px;
  height: 20px;
  background-color: rgb(160, 194, 221);
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  color: #000000;
  position: absolute;
  top: 50%;
  right: 10px;
  font: italic;
  font-size: 16px;
}

.cart-tab {
  width: 400px;
  background-color: #c5c3a8;
  color: black;
  position: fixed;
  z-index: 1000;
  top: 0;
  right: 0;
  bottom: 0;
  inset: 0 -1000px 0 auto;
  display: grid;
  grid-template-rows: 70px 1fr 40px;
  overflow-y: auto;
}

/* Cart header */
.cart-tab h1 {
  text-align: center;
  margin: 0;
  padding-top: 20px;
  font-family: "Fascinate Inline", cursive;
}


.cart-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #0b0929;
  padding: 10px 0;
  gap: 10px;
}

/* Product image */
.cart-item-img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 5px;
}

/* Product info */
.cart-item-info {
  flex: 1; /* takes remaining space */
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.cart-item-name {
  font-weight: bold;
  font-size: 16px;
  margin: 0;
}

.cart-item-price,
.cart-item-quantity {
  font-size: 14px;
  margin: 0;
}

/* Remove button */
.cart-item-remove {
  background-color: #0b0929;
  color: #c5c3a8;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-family: "Limelight", cursive;
}

.cart-item-remove:hover {
  background-color: #6e7597;
}

/* Cart total */
.cart-total {
  font-size: 18px;
  font-weight: bold;
  text-align: left;
  padding-left: 10px;
}


body.showCart .cart-tab {
  inset: 0 0 0 auto;
  transition: 0.3s;
}

/* Close button */
.closeCart {
  background-color: #0b0929;
  color: #c5c3a8;
  font-size: 18px;
  font-family: "Limelight", cursive;
  border: none;
  padding: 10px 20px;
  height: 60px;
  cursor: pointer;
}

.closeCart:hover {
  background-color: #6e7597;
}

/* Scrollbar for long carts */
.cart-tab::-webkit-scrollbar {
  width: 8px;
}

.cart-tab::-webkit-scrollbar-thumb {
  background-color: rgba(0,0,0,0.3);
  border-radius: 4px;
}

.cart-tab::-webkit-scrollbar-track {
  background-color: transparent;
}

.clearCart {
  background-color: #0b0929;
  color: #c5c3a8;
  font-size: 18px;
  font-family: "Limelight", cursive;
  border: none;
  border-radius: 10px;
  padding: 5px 5px;
  margin-top: -10px;
  margin-bottom: 10px;
  margin-left: 8px;
  cursor: pointer;
  width: 30%;
}

.clearCart:hover {
  background-color: #6e7597;
}






.card {
  /* Add shadows to create the "card" effect */
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
  transition: 0.3s;
  width: 28%;
  padding-top: 1%;
  padding-left: 1%;
  padding-right: 1%;
  padding-bottom: 5%;
}

/* On mouse-over, add a deeper shadow */
.card:hover {
  box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
}

/* Add some padding inside the card container */
.container {
  text-align: center;
}

.wrapper {
    display: flex; /* Makes the child elements sit side by side */
    justify-content: space-around; /* Distributes space between the cards */
    flex-wrap: wrap; /* Allows cards to wrap to the next line if the container is too narrow */
    gap: 20px; /* Adds a gap between cards (newer CSS property) */
}

.card-link {
  display: block;
  text-decoration: none;
  color: inherit; /* Inherit the color from the card */
}

.card img {
  width: 100%;
  height: 520px;
  object-fit: cover;
}


footer {
  background-color: #0b0929;
  color: #c5c3a8;
  font-family: "Limelight", cursive;
  padding: 25px 20px;
}

.footer-container {
  display: flex;          /* makes children appear side by side */
  justify-content: space-around; /* spreads them evenly */
  flex-wrap: wrap;        /* wraps items on small screens */
}

.footer-item {
  margin: 5px 10px;      /* spacing between items */
}

.footer-item a {
  color: #c5c3a8;
  text-decoration: none;
  margin: 0 5px;
}

img {
  max-width: 100%;
  height: auto;
}

@media (max-width: 768px) {
  .cart-tab {
    width: 100vw;
  }

  .cart-count {
    display: none;
  }

  /* MENU CARDS */

  .wrapper {
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 90%;
  }

  .card img {
    height: 250px;
  }

  /* HEADING */

  h2 {
    text-align: center;
    padding-left: 0;
    font-size: 40px;
  }

}

/* hide checkbox */
#menu-toggle {
  display: none;
}

/* hamburger icon */
.hamburger {
  display: none;
  font-size: 30px;
  color: #c5c3a8;
  padding: 10px 20px;
  cursor: pointer;
}

/* container for links */
.nav-links {
  display: flex;
}

@media (max-width: 768px) {

  .hamburger {
    display: block;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    background-color: #0b0929;
  }

  .nav-links li {
    text-align: center;
  }

  /* show menu when clicked */
  #menu-toggle:checked + .hamburger + .nav-links {
    display: flex;
  }
}

</style>
</head>

<body>
<ul class="topnav">

  <li><a class="logo" a href="index.html"> Medi </a></li>

  <!-- Hamburger checkbox -->
  <input type="checkbox" id="menu-toggle">
  <label for="menu-toggle" class="hamburger">&#9776;</label>

  <div class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="Menu.html">Menu</a></li>
    <li><a href="Contact.html">Contact</a></li>
    <li><a href="About.html">About</a></li>
    <li> <a href="#" class="cart-icon"> <i class="fa-solid fa-cart-shopping"></i> <span class="cart-count">0</span> </a> </li>
  </div>

</ul>

<div class="cart-tab">
  <h1>Your Cart</h1>
  <div class="cart-items">
    <!-- Items will be added dynamically here -->
  </div>
  <div class="cart-total">
    Total: $<span id="cart-total">0</span>
  </div>
  <button class="clearCart">Clear Cart</button>
  <button class="closeCart">Close</button>
</div>

<main>
<h2 style="font-family: 'Limelight', cursive; color: hsl(245, 61%, 12%); font-size: 50px; padding-left:50px">Menus</h2>

<div class="wrapper">

<a href="Food.html" class="card card-link">

<a href="Drinks.html" class="card card-link">
  <img src="https://cdn.shopify.com/s/files/1/2255/5671/files/rosecocktails_1024x1024.jpg?v=1529662356">

</main>

<br><br><br><br>

<footer>
  <div class="footer-container">
    <div class="footer-item">
      <p>Business Hours</p>
      <p>Mon-Fri: 8am - 10pm<br>Sat-Sun: 11am - 11pm</p>

    <div class="footer-item">
      <p>Social Media</p>
      <a href="https://www.facebook.com/medinyc" target="_blank" style="text-decoration: underline"><i class="fa fa-facebook-square" style="font-size:20px"></i> @medinewyork</a><br>

</body>

</html>
