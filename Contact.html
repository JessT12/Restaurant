<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medi</title>

<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fascinate+Inline&family=Limelight&display=swap" rel="stylesheet">
  
<style>
body {
  margin: 0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background-color: #0b0929;
  font-family:"Limelight", cursive;
  color:#c5c3a8;
}

main{
    flex: 1;
}

ul.topnav {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  list-style-type: none;
  margin: 0;
  padding: 0;
  background-color: #0b0929;
  align-items: center;
}

ul.topnav li:first-child {
  flex: 1;
}

ul.topnav li a {
  display: block;
  color: #c5c3a8;
  padding: 10px 20px;
  text-decoration: none;
  font-size: 20px;
  font-family: "Limelight", cursive;
}

ul.topnav li a:hover {
  background-color: #6e7597;
  padding: 10px 20px;
  border-radius: 5px;
}

ul.topnav li a.logo {
  font-family: "Fascinate Inline", cursive;
  font-size: 25px;
  color: #c5c3a8;
  
}

ul.topnav li a.logo:hover {
  background-color: transparent;
  padding: 10px 20px;
}

footer {
  background-color: #0b0929;
  color: #c5c3a8;
  font-family: "Limelight", cursive;
  padding: 25px 20px;
}




/*Shopping cart*/
.add-cart {
  background-color: #0b0929;
  color: #c5c3a8;
  font-size: 30px;
  font-family: "Limelight", cursive;
  padding: 1px 11px;
  border: none;
  border-radius: 50%;
  position: absolute;
  right: 1.5vw;
  top: 1.5vh;
  cursor: pointer;
}

.add-cart:hover {
  background-color: #6e7597;
  color: #c5c3a8;
}

.cart-icon i {
  font-size: 22px;
}

.cart-icon:hover {
  background-color: #6e7597;
  border-radius: 5px;
}

.cart-count {
  display: flex;
  width: 20px;
  height: 20px;
  background-color: rgb(160, 194, 221);
  justify-content: center;
  align-items: center;
  border-radius: 50%;
  color: #000000;
  position: absolute;
  top: 50%;
  right: 10px;
  font: italic;
  font-size: 16px;
}

.cart-tab {
  width: 400px;
  background-color: #c5c3a8;
  color: black;
  position: fixed;
  z-index: 1000;
  top: 0;
  right: 0;
  bottom: 0;
  inset: 0 -1000px 0 auto;
  display: grid;
  grid-template-rows: 70px 1fr 40px;
  overflow-y: auto;
}

/* Cart header */
.cart-tab h1 {
  text-align: center;
  margin: 0;
  padding-top: 20px;
  font-family: "Fascinate Inline", cursive;
}


.cart-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #0b0929;
  padding: 10px 0;
  gap: 10px;
}

/* Product image */
.cart-item-img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 5px;
}

/* Product info */
.cart-item-info {
  flex: 1; /* takes remaining space */
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.cart-item-name {
  font-weight: bold;
  font-size: 16px;
  margin: 0;
}

.cart-item-price,
.cart-item-quantity {
  font-size: 14px;
  margin: 0;
}

/* Remove button */
.cart-item-remove {
  background-color: #0b0929;
  color: #c5c3a8;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-family: "Limelight", cursive;
}

.cart-item-remove:hover {
  background-color: #6e7597;
}

/* Cart total */
.cart-total {
  font-size: 18px;
  font-weight: bold;
  text-align: left;
  padding-left: 10px;
}


body.showCart .cart-tab {
  inset: 0 0 0 auto;
  transition: 0.3s;
}

/* Close button */
.closeCart {
  background-color: #0b0929;
  color: #c5c3a8;
  font-size: 18px;
  font-family: "Limelight", cursive;
  border: none;
  padding: 10px 20px;
  height: 60px;
  cursor: pointer;
}

.closeCart:hover {
  background-color: #6e7597;
}

/* Scrollbar for long carts */
.cart-tab::-webkit-scrollbar {
  width: 8px;
}

.cart-tab::-webkit-scrollbar-thumb {
  background-color: rgba(0,0,0,0.3);
  border-radius: 4px;
}

.cart-tab::-webkit-scrollbar-track {
  background-color: transparent;
}

.clearCart {
  background-color: #0b0929;
  color: #c5c3a8;
  font-size: 18px;
  font-family: "Limelight", cursive;
  border: none;
  border-radius: 10px;
  padding: 5px 5px;
  margin-top: -10px;
  margin-bottom: 10px;
  margin-left: 8px;
  cursor: pointer;
  width: 30%;
}

.clearCart:hover {
  background-color: #6e7597;
}







.footer-container {
  display: flex;          /* makes children appear side by side */
  justify-content: space-around; /* spreads them evenly */
  flex-wrap: wrap;        /* wraps items on small screens */
}

.footer-item {
  margin: 5px 10px;      /* spacing between items */
}

.footer-item a {
  color: #c5c3a8;
  text-decoration: none;
  margin: 0 5px;
}


.contact-form {
  max-width: 500px;
  display: flex;
  flex-direction: column;
  
}

.contact-form input,
.contact-form textarea {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.contact-form button {
  background-color: #2c0e96;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.contact-form button:hover {
  background-color: rgba(88, 98, 150, 0.685);
}

.map {
  margin: 40px auto;
  max-width: 800px;
}
/* hide checkbox */
#menu-toggle {
  display: none;
}

/* hamburger icon */
.hamburger {
  display: none;
  font-size: 30px;
  color: #c5c3a8;
  padding: 10px 20px;
  cursor: pointer;
}

/* container for links */
.nav-links {
  display: flex;
}

@media (max-width: 768px) {

  .cart-tab {
    width: 100vw;
  }

  .cart-count {
    display: none;
  }

  .hamburger {
    display: block;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    background-color: #0b0929;
  }

  .nav-links li {
    text-align: center;
  }

  /* show menu when clicked */
  #menu-toggle:checked + .hamburger + .nav-links {
    display: flex;
  }
}

</style>
</head>

<body>
<ul class="topnav">

  <li><a class="logo" a href="index.html"> Medi </a></li>

  <!-- Hamburger checkbox -->
  <input type="checkbox" id="menu-toggle">
  <label for="menu-toggle" class="hamburger">&#9776;</label>

  <div class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="Menu.html">Menu</a></li>
    <li><a href="Contact.html">Contact</a></li>
    <li><a href="About.html">About</a></li>
    <li> <a href="#" class="cart-icon"> <i class="fa-solid fa-cart-shopping"></i> <span class="cart-count">0</span> </a> </li>
  </div>

</ul>


<div class="cart-tab">
  <h1>Your Cart</h1>
  <div class="cart-items">
    <!-- Items will be added dynamically here -->
  </div>
  <div class="cart-total">
    Total: $<span id="cart-total">0</span>
  </div>
  <button class="clearCart">Clear Cart</button>
  <button class="closeCart">Close</button>
</div>

<main>
<section class="contact-map">
    <h2 style="padding-left: 2%;">Find Us</h2>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8548.050651629663!2d-73.98301526628872!3d40.757795246628575!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25859e0a76abf%3A0xcc56da9feb6dde51!2sMedi%20Wine%20Bar%20%26%20Restaurant!5e0!3m2!1sen!2sus!4v1773082465967!5m2!1sen!2sus" 
    width=100% 
    height="450" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="no-referrer-when-downgrade">
</iframe>
</section>

<form class="contact-form" style="padding-left: 2%;">

  <label for="email">Email:</label><br>

</main>
<br>

<footer>
  <div class="footer-container">
    <div class="footer-item">
      <p>Business Hours</p>
      <p>Mon-Fri: 8am - 10pm<br>Sat-Sun: 11am - 11pm</p>

    <div class="footer-item">
      <p>Social Media</p>
      <a href="https://www.facebook.com/medinyc" target="_blank" style="text-decoration: underline"><i class="fa fa-facebook-square" style="font-size:20px"></i> @medinewyork</a><br>
      <a href="https://www.instagram.com/medinyc/" target="_blank" style="text-decoration: underline"><i class="fa fa-instagram" style="font-size:20px"></i> @medirestaurantnyc</a>

</footer>

</body>

<script src="script.js"></script>



</html>
