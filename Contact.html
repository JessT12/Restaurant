<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medi</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fascinate+Inline&family=Limelight&display=swap" rel="stylesheet">
  
<style>
body {
  margin: 0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  background-color: #0b0929;
  font-family:"Limelight", cursive;
  color:#c5c3a8;
}

main{
    flex: 1;
}

ul.topnav {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  list-style-type: none;
  margin: 0;
  padding: 0;
  background-color: #0b0929;
  align-items: center;
}

ul.topnav li:first-child {
  flex: 1;
}

ul.topnav li a {
  display: block;
  color: #c5c3a8;
  padding: 10px 20px;
  text-decoration: none;
  font-size: 20px;
  font-family: "Limelight", cursive;
}

ul.topnav li a:hover {
  background-color: #6e7597;
  padding: 10px 20px;
  border-radius: 5px;
}

ul.topnav li a.logo {
  font-family: "Fascinate Inline", cursive;
  font-size: 25px;
  color: #c5c3a8;
  
}

ul.topnav li a.logo:hover {
  background-color: transparent;
  padding: 10px 20px;
}

footer {
  background-color: #0b0929;
  color: #c5c3a8;
  font-family: "Limelight", cursive;
  padding: 25px 20px;
}

.footer-container {
  display: flex;          /* makes children appear side by side */
  justify-content: space-around; /* spreads them evenly */
  flex-wrap: wrap;        /* wraps items on small screens */
}

.footer-item {
  margin: 5px 10px;      /* spacing between items */
}

.footer-item a {
  color: #c5c3a8;
  text-decoration: none;
  margin: 0 5px;
}


.contact-form {
  max-width: 500px;
  display: flex;
  flex-direction: column;
  
}

.contact-form input,
.contact-form textarea {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.contact-form button {
  background-color: #2c0e96;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.contact-form button:hover {
  background-color: rgba(88, 98, 150, 0.685);
}

.map {
  margin: 40px auto;
  max-width: 800px;
}
/* hide checkbox */
#menu-toggle {
  display: none;
}

/* hamburger icon */
.hamburger {
  display: none;
  font-size: 30px;
  color: #c5c3a8;
  padding: 10px 20px;
  cursor: pointer;
}

/* container for links */
.nav-links {
  display: flex;
}

@media (max-width: 768px) {

  .hamburger {
    display: block;
  }

  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    background-color: #0b0929;
  }

  .nav-links li {
    text-align: center;
  }

  /* show menu when clicked */
  #menu-toggle:checked + .hamburger + .nav-links {
    display: flex;
  }
}

</style>
</head>

<body>
<ul class="topnav">

  <li><a class="logo" a href="index.html"> Medi </a></li>

  <!-- Hamburger checkbox -->
  <input type="checkbox" id="menu-toggle">
  <label for="menu-toggle" class="hamburger">&#9776;</label>

  <div class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="Menu.html">Menu</a></li>
    <li><a href="Contact.html">Contact</a></li>
    <li><a href="About.html">About</a></li>
  </div>

</ul>

<main>
<section class="contact-map">
    <h2 style="padding-left: 2%;">Find Us</h2>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8548.050651629663!2d-73.98301526628872!3d40.757795246628575!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25859e0a76abf%3A0xcc56da9feb6dde51!2sMedi%20Wine%20Bar%20%26%20Restaurant!5e0!3m2!1sen!2sus!4v1773082465967!5m2!1sen!2sus" 
    width=100% 
    height="450" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="no-referrer-when-downgrade">
</iframe>
</section>

<h2 style="padding-left: 2%;">Contact Us</h2>

<form class="contact-form" style="padding-left: 2%;"> 
  <label for="name">Name:</label><br>
  <input type="text" id="name" name="name"><br>
  <label for="email">Email:</label><br>
  <input type="email" id="email" name="email"><br>
  <label for="message">Message:</label><br>
  <textarea id="message" name="message" rows="5"></textarea><br>
  <button type="submit">Send Message</button>
</form>
</main>
<br>

<footer>
  <div class="footer-container">
    <div class="footer-item">
      <p>Business Hours</p>
      <p>Mon-Fri: 8am - 10pm<br>Sat-Sun: 11am - 11pm</p>
    </div>

    <div class="footer-item">
      <p>Social Media</p>
      <a href="https://www.facebook.com/medinyc" target="_blank" style="text-decoration: underline"><i class="fa fa-facebook-square" style="font-size:20px"></i> @medinewyork</a><br>
      <a href="https://www.instagram.com/medinyc/" target="_blank" style="text-decoration: underline"><i class="fa fa-instagram" style="font-size:20px"></i> @medirestaurantnyc</a>
    </div>
</footer>

</body>


</html>
